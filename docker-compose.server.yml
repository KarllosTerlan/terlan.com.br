# docker-compose.server.yml  — Deploy no servidor Hetzner
# Usa o Traefik já existente no servidor (rede 'web')
# Não cria Traefik próprio para não conflitar na porta 80/443

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinic-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    image: atendai/evolution-api:latest
    container_name: clinic-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: https://evolution.terlan.com.br
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      LOG_COLOR: "true"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      # Autenticação
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # QR Code
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"
      # Banco de dados
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      # Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      # Webhook global desativado
      WEBHOOK_GLOBAL_ENABLED: "false"
      # Sessão
      CONFIG_SESSION_PHONE_CLIENT: "Terlan"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.terlan-evolution.rule=Host(`evolution.terlan.com.br`)"
      - "traefik.http.routers.terlan-evolution.entrypoints=websecure"
      - "traefik.http.routers.terlan-evolution.tls.certresolver=letsencrypt"
      - "traefik.http.services.terlan-evolution.loadbalancer.server.port=8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - web
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clinic-backend
    container_name: clinic-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-1024}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://api.terlan.com.br/auth/google/callback
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-PUT_YOUR_WHATSAPP_TOKEN_HERE}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-clinic-bot-verify}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_API_VERSION: v19.0
      FRONTEND_URL: https://app.terlan.com.br
      PUBLIC_API_URL: https://api.terlan.com.br
      RATE_LIMIT_MS: ${RATE_LIMIT_MS:-60000}
      REMINDER_LEAD_MINUTES: ${REMINDER_LEAD_MINUTES:-60}
      CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-30}
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.terlan-backend.rule=Host(`api.terlan.com.br`)"
      - "traefik.http.routers.terlan-backend.entrypoints=websecure"
      - "traefik.http.routers.terlan-backend.tls=true"
      - "traefik.http.routers.terlan-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.terlan-backend.loadbalancer.server.port=3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.terlan.com.br
    image: clinic-frontend
    container_name: clinic-frontend
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.terlan-frontend.rule=Host(`app.terlan.com.br`)"
      - "traefik.http.routers.terlan-frontend.entrypoints=websecure"
      - "traefik.http.routers.terlan-frontend.tls=true"
      - "traefik.http.routers.terlan-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.terlan-frontend.loadbalancer.server.port=80"

volumes:
  pgdata:
    name: terlan_pgdata
  redisdata:
    name: terlan_redisdata
  evolution_instances:
    name: terlan_evolution_instances
  evolution_store:
    name: terlan_evolution_store

networks:
  internal:
    name: terlan-internal
    driver: bridge
  web:
    external: true
    name: web
